<style>
:root{
  --bg:#F3EEE4; --ink:#1B1A18; --ink-soft:rgba(27,26,24,.62); --gold:#B08D57;
  --serif:'Fraunces',Georgia,serif; --sans:'Inter',-apple-system,BlinkMacSystemFont,sans-serif;
  --ease:cubic-bezier(.16,.84,.44,1);
}
*{ box-sizing:border-box; margin:0; padding:0; }
html,body{ height:100%; }
body{
  background:var(--bg); color:var(--ink); font-family:var(--sans); line-height:1.5;
  -webkit-font-smoothing:antialiased; display:flex; flex-direction:column; overflow-x:hidden;
}
a{ color:inherit; text-decoration:none; }
.top{ padding:clamp(1.25rem,3vw,2rem) clamp(1.25rem,4vw,3rem); }
.brand{ font-family:var(--serif); font-weight:600; font-size:1.05rem; letter-spacing:-.01em; }
main{
  flex:1; display:flex; flex-direction:column; justify-content:center;
  padding:2rem clamp(1.25rem,4vw,3rem) 4rem; max-width:1100px; width:100%; margin:0 auto;
}
.tag{ font-size:.7rem; letter-spacing:.2em; text-transform:uppercase; color:var(--gold); font-weight:600; margin-bottom:1.4rem; }
.num{
  font-family:var(--serif); font-weight:300; line-height:.9; letter-spacing:-.04em;
  font-size:clamp(6rem,22vw,15rem); color:var(--ink);
}
.num em{ font-style:italic; color:var(--gold); }
h1{
  font-family:var(--serif); font-weight:300; font-size:clamp(1.6rem,3.4vw,2.6rem);
  line-height:1.15; letter-spacing:-.015em; max-width:18ch; margin:1.6rem 0 1rem;
}
h1 em{ font-style:italic; color:var(--gold); }
p{ color:var(--ink-soft); max-width:46ch; margin-bottom:2.2rem; }
.btn{ display:inline-flex; align-items:stretch; gap:4px; }
.btn-label{
  background:var(--ink); color:var(--bg); border-radius:14px 4px 4px 14px;
  padding:.95rem 1.4rem; font-size:.74rem; letter-spacing:.16em; text-transform:uppercase; font-weight:600;
  transition:background .3s var(--ease);
}
.btn-arrow{
  background:var(--gold); color:var(--ink); border-radius:4px 14px 14px 4px;
  display:grid; place-items:center; width:3.1rem; font-size:1.1rem;
  transition:transform .35s var(--ease);
}
.btn:hover .btn-label{ background:#000; }
.btn:hover .btn-arrow{ transform:translateX(3px); }
.alt{ margin-top:1.6rem; font-size:.9rem; color:var(--ink-soft); }
.alt a{ color:var(--ink); border-bottom:1px solid var(--gold); padding-bottom:1px; }
.alt a:hover{ color:var(--gold); }
@media (max-width:699px){ h1{ max-width:15ch; } }
</style>
</head>
<body>
<header class="top"><a href="/" class="brand">Priscila Andrade</a></header>
<main>
  <span class="tag">Erro 404</span>
  <div class="num" aria-hidden="true">4<em>0</em>4</div>
  <h1>Esta página não está <em>por&nbsp;aqui.</em></h1>
  <p>O endereço pode ter mudado ou ter sido digitado errado. O portfólio completo está na página inicial.</p>
  <a class="btn" href="/"><span class="btn-label">Voltar ao início</span><span class="btn-arrow" aria-hidden="true">&rarr;</span></a>
  <p class="alt">Ou fale direto comigo no <a href="https://wa.me/5511974807165" target="_blank" rel="noopener">WhatsApp</a>.</p>
</main>
</body>
</html>
